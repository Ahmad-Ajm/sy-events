<!-- تعليق: صفحة التقويم الكامل - مثل Google Calendar -->
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">
      <i class="fas fa-calendar-alt me-2"></i>
      تقويمي
    </h2>
    <span class="badge bg-info">{{ events().length }} فعالية</span>
  </div>

  <!-- تعليق: التقويم الكامل - FullCalendar -->
  <div class="card mb-4">
    <div class="card-body p-3">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>

  <!-- تعليق: جدول الألوان - شرح معنى كل لون -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="fas fa-palette me-2"></i>
        دليل الألوان
      </h5>
    </div>
    <div class="card-body">
      <div class="row g-3">
        @for (item of colorLegend | keyvalue; track item.key) {
          <div class="col-md-6 col-lg-4">
            <div class="d-flex align-items-center">
              <div
                class="color-box me-3"
                [style.background-color]="item.value.color">
              </div>
              <div>
                <strong>{{ item.value.label }}</strong>
                <p class="text-muted mb-0 small">{{ item.value.description }}</p>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- تعليق: ملاحظة للمستخدم -->
  <div class="alert alert-info mt-4" role="alert">
    <i class="fas fa-info-circle me-2"></i>
    <strong>ملاحظة:</strong> انقر على أي فعالية في التقويم لعرض تفاصيلها. يمكنك التنقل بين الأشهر والسنوات باستخدام الأزرار أعلاه.
  </div>
</div>
