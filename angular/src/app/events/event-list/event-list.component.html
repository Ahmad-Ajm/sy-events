<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Events' | abpLocalization }}</h5>
      </div>
      <div class="col col-md-6 text-end">
        <button class="btn btn-primary" type="button" (click)="createEvent()">
          <i class="fa fa-plus me-1"></i>
          {{ '::NewEvent' | abpLocalization }}
        </button>
      </div>
    </div>
  </div>
  
  <!-- تعليق: قسم الفلاتر المتقدمة -->
  <div class="card-body border-bottom">
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">{{ '::Search' | abpLocalization }}</label>
        <input type="text" class="form-control" placeholder="ابحث عن فعالية..." [(ngModel)]="filters.filter" (ngModelChange)="applyFilters()" />
      </div>
      <div class="col-md-3">
        <label class="form-label">{{ '::City' | abpLocalization }}</label>
        <select class="form-select" [(ngModel)]="filters.cityId" (ngModelChange)="applyFilters()">
          <option [value]="null">-- الكل --</option>
          <!-- TODO: Load cities from API -->
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">{{ '::Category' | abpLocalization }}</label>
        <select class="form-select" [(ngModel)]="filters.categoryId" (ngModelChange)="applyFilters()">
          <option [value]="null">-- الكل --</option>
          <!-- TODO: Load categories from API -->
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">الحالة الزمنية</label>
        <select class="form-select" [(ngModel)]="filters.isUpcoming" (ngModelChange)="applyFilters()">
          <option [value]="null">-- الكل --</option>
          <option [value]="true">قادمة</option>
          <option [value]="false">منقضية</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">المنظّم</label>
        <input type="text" class="form-control" placeholder="بريد المنظم أو اسمه" [(ngModel)]="filters.organizerFilter" (ngModelChange)="applyFilters()" />
      </div>
      <div class="col-md-3">
        <label class="form-label">عدد الحضور (أكبر من)</label>
        <input type="number" class="form-control" placeholder="0" [(ngModel)]="filters.minAttendees" (ngModelChange)="applyFilters()" />
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-secondary w-100 mt-4" (click)="clearFilters()">
          <i class="fa fa-times me-1"></i>
          مسح الفلاتر
        </button>
      </div>
    </div>
  </div>
  
  <div class="card-body">
    <!-- شبكة بطاقات الفعاليات بأسلوب حديث -->
    <div class="row g-4">
      <div class="col-md-4" *ngFor="let row of events.items">
        <div class="event-card">
          <img class="event-image" [src]="resolveImageUrl(row.imageUrl)" (error)="onImgError($event)" [alt]="row.title">

          <!-- شريط علوي: العنوان يمين، التاريخ يسار (RTL) -->
          <div class="overlay-top">
            <h5 class="event-title">{{ row.title }}</h5>
            <div class="event-date">
              <i class="fa fa-calendar-alt ms-1"></i>
              {{ row.startDate | date:'dd/MM/yyyy' }}
            </div>
          </div>

          <!-- شريط سفلي: زر متابعة أسفل يسار داخل الصورة -->
          <div class="overlay-bottom">
            <a class="btn btn-outline-light btn-sm follow-btn" [routerLink]="['/events', row.id]">
              <i class="fa fa-eye ms-1"></i> متابعة
            </a>
          </div>
        </div>

        <!-- مجموعة أزرار الإجراءات تحت البطاقة -->
        <div class="event-actions mt-2 d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div class="btn-group btn-group-sm me-2 mb-2" role="group">
            <button class="btn btn-primary" (click)="editEvent(row.id)" title="{{ '::Edit' | abpLocalization }}" aria-label="{{ '::Edit' | abpLocalization }}">
              <i class="fa fa-edit"></i>
            </button>
            <label class="btn btn-info mb-0" [attr.title]="('::Upload' | abpLocalization)" aria-label="{{ '::Upload' | abpLocalization }}">
              <i class="fa fa-upload"></i>
              <input type="file" class="d-none" (change)="onUpload($event, row.id)" />
            </label>
            <app-file-upload [eventId]="row.id"></app-file-upload>
          </div>
          <div class="btn-group btn-group-sm mb-2" role="group">
            <button *ngIf="row.status === EventStatus.Pending" class="btn btn-success" (click)="approveEvent(row.id)" title="{{ '::Approve' | abpLocalization }}" aria-label="{{ '::Approve' | abpLocalization }}">
              <i class="fa fa-check"></i>
            </button>
            <button *ngIf="row.status === EventStatus.Pending" class="btn btn-warning" (click)="rejectEvent(row.id)" title="{{ '::Reject' | abpLocalization }}" aria-label="{{ '::Reject' | abpLocalization }}">
              <i class="fa fa-times"></i>
            </button>
            <button class="btn btn-danger" (click)="deleteEvent(row.id)" title="{{ '::Delete' | abpLocalization }}" aria-label="{{ '::Delete' | abpLocalization }}">
              <i class="fa fa-trash"></i>
            </button>
            <a class="btn btn-outline-info" [routerLink]="['/events', row.id]" title="عرض" aria-label="عرض">
              <i class="fa fa-external-link"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen" [busy]="false">
  <ng-template #abpHeader>
    <h3>{{ (selectedEvent.id ? '::Edit' : '::NewEvent') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="mb-3">
        <label for="title" class="form-label">{{ '::Title' | abpLocalization }} *</label>
        <input type="text" id="title" class="form-control" formControlName="title" />
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">{{ '::Description' | abpLocalization }} *</label>
        <textarea id="description" class="form-control" formControlName="description" rows="3"></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="startDate" class="form-label">{{ '::StartDate' | abpLocalization }} *</label>
          <input type="datetime-local" id="startDate" class="form-control" formControlName="startDate" />
        </div>
        <div class="col-md-6 mb-3">
          <label for="endDate" class="form-label">{{ '::EndDate' | abpLocalization }} *</label>
          <input type="datetime-local" id="endDate" class="form-control" formControlName="endDate" />
        </div>
      </div>

      <div class="mb-3">
        <label for="location" class="form-label">{{ '::Location' | abpLocalization }} *</label>
        <input type="text" id="location" class="form-control" formControlName="location" />
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="categoryId" class="form-label">{{ '::Category' | abpLocalization }} *</label>
          <select id="categoryId" class="form-control" formControlName="categoryId">
            <option value="">{{ '::SelectCategory' | abpLocalization }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="cityId" class="form-label">{{ '::City' | abpLocalization }} *</label>
          <select id="cityId" class="form-control" formControlName="cityId">
            <option value="">{{ '::SelectCity' | abpLocalization }}</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label for="maxCapacity" class="form-label">{{ '::MaxCapacity' | abpLocalization }}</label>
        <input type="number" id="maxCapacity" class="form-control" formControlName="maxCapacity" />
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" (click)="isModalOpen = false">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check me-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
